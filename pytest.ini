[pytest]
# Cấu hình riêng cho kiểm thử: mặc định chạy SQLite trong bộ nhớ, không phụ
# thuộc DB_ENGINE trong .env. Đặt TEST_ON_MSSQL=True để chạy trên SQL Server.
DJANGO_SETTINGS_MODULE = config.settings_test

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    # --ds có độ ưu tiên CAO NHẤT, thắng cả biến môi trường
    # DJANGO_SETTINGS_MODULE nếu máy lỡ có sẵn biến đó
    --ds=config.settings_test
    # Mặc định bỏ qua E2E để lệnh `pytest` chạy nhanh (vài giây).
    # Chạy E2E bằng:  pytest -m e2e
    -m "not e2e"
    -ra
    --strict-markers
    --tb=short
    --reuse-db

filterwarnings =
    ignore:No directory at:UserWarning

markers =
    unit: Kiểm thử đơn vị - logic thuần, không cần trình duyệt (Giai đoạn 1)
    integration: Kiểm thử tích hợp qua HTTP, không cần trình duyệt
    e2e: Kiểm thử giao diện đầu-cuối bằng Playwright (Giai đoạn 2)
    inventory: Nghiệp vụ kho - lô hàng, xuất/nhập/hoàn kho
    finance: Nghiệp vụ tài chính - giá vốn COGS, tổng tiền, giảm giá
    accounts: Nghiệp vụ người dùng - đăng ký, mật khẩu, phân quyền
    slow: Test chạy lâu, bỏ qua bằng: pytest -m "not slow"
