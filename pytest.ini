[pytest]
# Dùng cấu hình riêng cho test: mặc định chạy SQLite trong bộ nhớ,
# không phụ thuộc DB_ENGINE trong .env. Đặt TEST_ON_MSSQL=True để chạy
# trên SQL Server khi cần kiểm tra tương thích.
DJANGO_SETTINGS_MODULE = config.settings_test

# Chỉ thu thập test trong thư mục tests/ để không lẫn với bộ test cũ
# ở apps/*/tests.py (bộ cũ vẫn chạy được bằng: python manage.py test)
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --reuse-db

filterwarnings =
    ignore:No directory at:UserWarning

markers =
    unit: Kiểm thử đơn vị - logic thuần, không cần trình duyệt (Giai đoạn 1)
    inventory: Nghiệp vụ kho - lô hàng, xuất/nhập/hoàn kho
    finance: Nghiệp vụ tài chính - giá vốn COGS, tổng tiền, giảm giá
    accounts: Nghiệp vụ người dùng - đăng ký, mật khẩu, phân quyền
    e2e: Kiểm thử giao diện đầu-cuối bằng Playwright (Giai đoạn 2)
    slow: Test chạy lâu, bỏ qua bằng: pytest -m "not slow"
